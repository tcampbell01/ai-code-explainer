  <rect x="410" y="640" width="180" height="50" fill="white" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="500" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
