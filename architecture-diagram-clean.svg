  </text>
  
  <!-- Data Flow Arrows -->
  <path d="M 400 170 L 400 210" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 550 300 L 650 300" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">HTTP/JSON</text>
  <path d="M 900 390 L 700 430" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 550 L 600 590" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Technology Stack -->
  <rect x="50" y="740" width="1100" height="40" fill="#333" rx="5"/>
  <text x="600" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
