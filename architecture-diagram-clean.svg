  </text>
  <text x="600" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">
    Users access via http://localhost:3000 • Paste code • Select language & skill level • Get explanations
  </text>
  
  <!-- Frontend Layer -->
  <rect x="50" y="210" width="500" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
